name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: echo "_worker.js" > dist/.assetsignore
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # The cntmgmt preview deployment (design 04 path 2): the same site with every page rendered
      # on request, as the Worker content-preview on preview.content.cntmgmt.com.
      - run: bun run build
        env:
          CNTMGMT_PREVIEW_DEPLOYMENT: '1'
      - run: echo "_worker.js" > dist/.assetsignore
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview
